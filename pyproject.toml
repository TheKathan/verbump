[project]
name = "verbump-cli"
dynamic = ["version"]
description = "Version and changelog bumps for repos"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gonçalo Faria" }]
keywords = ["version", "semver", "changelog", "release", "monorepo", "bump", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
"Action: release" = "https://github.com/TheKathan/verbump-release"
"Action: check" = "https://github.com/TheKathan/verbump-check"
"Action: setup" = "https://github.com/TheKathan/setup-verbump"
Source = "https://github.com/TheKathan/verbump"
Changelog = "https://github.com/TheKathan/verbump/blob/main/CHANGELOG.md"

[project.scripts]
verbump = "verbump.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "verbump.__version__" }
