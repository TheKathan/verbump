name: release

# Every PR merged into main releases the packages it changed (verbump.toml). trunk-semver
# reads the merged PR's source branch and picks the bump:
#   feature/* or feat/*      -> minor
#   anything else            -> patch
#   release/X.Y.Z            -> exactly X.Y.Z (release/<package>/X.Y.Z in a monorepo)
# verbump applies that bump to each changed package from its own last tag, writes the
# version files and the changelog, then tags and publishes a GitHub release per package.
# This repo releases itself with its own action (uses: ./), from the commit being released.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    # the bot's own version commit must not release again
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test
        run: make test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      # With a RELEASE_DEPLOY_KEY secret (a write deploy key), pushes go through rulesets
      # that only let the key bypass PRs; without it, the job token pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: ./
