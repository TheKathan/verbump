name: "verbump"
description: "Version and changelog bumps for repos: bump the packages that changed, tag them and publish their releases."
author: "TheKathan"

branding:
  icon: "tag"
  color: "blue"

# Run after actions/checkout with fetch-depth: 0, in a job with contents: write and
# pull-requests: read. The bump comes from `bump` or, when that is empty, from
# trunk-semver reading the merged PR's source branch. verbump brings its own Python, so
# the repo can be any stack and the job's own Python is left alone.

inputs:
  bump:
    description: "major, minor or patch. Empty: ask trunk-semver, which reads the merged PR's branch name."
    required: false
    default: ""
  trunk-semver-major:
    description: "major-version passed to trunk-semver. Only the step it computes is used, so this never caps a package's version."
    required: false
    default: "0"
  config:
    description: "Path to verbump.toml, relative to working-directory."
    required: false
    default: "verbump.toml"
  working-directory:
    description: "Repo root."
    required: false
    default: "."
  push:
    description: "Commit, tag and push the release. false only writes the files and the plan."
    required: false
    default: "true"
  github-release:
    description: "Publish a GitHub release per package (needs push)."
    required: false
    default: "true"
  branch:
    description: "Branch to push the release commit to."
    required: false
    default: "main"
  github-token:
    description: "Token for the PR lookup and the GitHub releases."
    required: false
    default: ${{ github.token }}

outputs:
  released:
    description: "true when at least one package was released."
    value: ${{ steps.apply.outputs.count != '0' }}
  tags:
    description: "JSON array of the tags created."
    value: ${{ steps.apply.outputs.tags }}
  plan:
    description: "Path to the plan JSON (bump, commit_message, releases)."
    value: ${{ steps.apply.outputs.plan }}

runs:
  using: "composite"
  steps:
    - name: Python for verbump
      id: python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
        update-environment: false

    - name: Source branch of the merged PR
      id: source
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        src=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].head.ref // ""' 2>/dev/null || true)
        echo "branch=$src" >> "$GITHUB_OUTPUT"
        echo "PR source branch: ${src:-(none, direct push)}"

    # trunk-semver tags and pushes a repo-wide vX.Y.Z. Only its bump is wanted, so it runs
    # against a local mirror and its tags never reach the remote.
    - name: Keep trunk-semver's tags in a local sandbox
      if: inputs.bump == ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        echo "VERBUMP_ORIGIN_URL=$(git remote get-url origin)" >> "$GITHUB_ENV"
        sandbox="$RUNNER_TEMP/verbump-tag-sandbox.git"
        rm -rf "$sandbox"
        git clone --quiet --mirror . "$sandbox"
        git remote set-url origin "$sandbox"

    - name: Bump from trunk-semver
      id: semver
      if: inputs.bump == ''
      uses: TheKathan/trunk-semver@bdfa679941c534feeb98f967803cff48cdc3455e # v1.0.14
      with:
        major-version: ${{ inputs.trunk-semver-major }}
        github-token: ${{ inputs.github-token }}

    # --prune-tags also drops the vX.Y.Z (and vX) that trunk-semver created locally.
    - name: Point origin back at the remote
      if: always() && inputs.bump == ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [[ -n "${VERBUMP_ORIGIN_URL:-}" ]]; then
          git remote set-url origin "$VERBUMP_ORIGIN_URL"
          git fetch --quiet --prune --prune-tags --tags --force origin
        fi

    - name: Write versions and changelogs
      id: apply
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PY: ${{ steps.python.outputs.python-path }}
        PYTHONPATH: ${{ github.action_path }}/src
        BUMP: ${{ inputs.bump }}
        PREVIOUS: ${{ steps.semver.outputs.previous-version }}
        NEXT: ${{ steps.semver.outputs.version }}
        SOURCE: ${{ steps.source.outputs.branch }}
        CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        plan="$RUNNER_TEMP/verbump-plan.json"
        if [[ -n "$BUMP" ]]; then
          bump=(--bump "$BUMP")
        elif [[ -n "$PREVIOUS" && -n "$NEXT" ]]; then
          bump=(--previous "$PREVIOUS" --version-from "$NEXT")
        else
          # trunk-semver leaves previous-version empty when HEAD already has a v tag
          bump=(--branch "$SOURCE")
        fi
        "$PY" -m verbump -c "$CONFIG" apply "${bump[@]}" --release-branch "$SOURCE" --plan-out "$plan"
        "$PY" -m verbump -c "$CONFIG" check
        {
          echo "plan=$plan"
          echo "count=$(jq '.releases | length' "$plan")"
          echo "tags=$(jq -c '[.releases[].tag]' "$plan")"
        } >> "$GITHUB_OUTPUT"
        {
          echo "## verbump release plan"
          echo
          if [[ -n "$PREVIOUS" ]]; then echo "trunk-semver: \`$PREVIOUS\` → \`$NEXT\`. "; fi
          echo "Bump: **$(jq -r .bump "$plan")**, source branch \`${SOURCE:-none}\`"
          echo
          if [[ "$(jq '.releases | length' "$plan")" == "0" ]]; then
            echo "Nothing to release: no package changed since its last tag."
          else
            echo "| Package | Previous | Version | Tag | Why |"
            echo "|---|---|---|---|---|"
            jq -r '.releases[] | "| \(.name) | \(.previous // "-") | \(.version) | `\(.tag)` | \(.reason) |"' "$plan"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Commit, tag and push
      if: inputs.push == 'true' && steps.apply.outputs.count != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PY: ${{ steps.python.outputs.python-path }}
        PYTHONPATH: ${{ github.action_path }}/src
        PLAN: ${{ steps.apply.outputs.plan }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail
        for tag in $(jq -r '.releases[].tag' "$PLAN"); do
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]]; then
            echo "::error::tag $tag already exists on the remote; exact version tags are never moved"; exit 1
          fi
        done
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "files already at the planned versions"
        else
          git commit -m "$(jq -r .commit_message "$PLAN")"
          git push origin "HEAD:$BRANCH"
        fi
        "$PY" -m verbump tag --plan "$PLAN"
        for tag in $(jq -r '.releases[].tag' "$PLAN"); do git push origin "refs/tags/$tag"; done
        for tag in $(jq -r '.releases[].major_tag // empty' "$PLAN"); do git push --force origin "refs/tags/$tag"; done

    - name: Publish the GitHub releases
      if: inputs.push == 'true' && inputs.github-release == 'true' && steps.apply.outputs.count != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PY: ${{ steps.python.outputs.python-path }}
        PYTHONPATH: ${{ github.action_path }}/src
        PLAN: ${{ steps.apply.outputs.plan }}
        CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        jq -r '.releases[] | "\(.name)\t\(.version)\t\(.tag)"' "$PLAN" | while IFS=$'\t' read -r name version tag; do
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"; continue
          fi
          "$PY" -m verbump -c "$CONFIG" notes "$name" "$version" > "$RUNNER_TEMP/verbump-notes.md"
          gh release create "$tag" --title "$name $version" --notes-file "$RUNNER_TEMP/verbump-notes.md" --verify-tag
        done
